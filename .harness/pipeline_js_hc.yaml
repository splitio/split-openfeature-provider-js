pipeline:
  name: split-openfeature-provider-js hc
  identifier: splitopenfeatureproviderjs_hc
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: split-openfeature-provider-js
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Node
                  identifier: Install_Node
                  spec:
                    shell: Bash
                    command: |-
                      curl https://mise.run | sh
                      export PATH="$HOME/.local/bin:$PATH"
                      mise use --global node@<+matrix.nodeVersion>
                      node --version
                      npm --version
              - step:
                  type: Run
                  name: Start Redis
                  identifier: Start_Redis
                  spec:
                    shell: Sh
                    command: |-
                      curl -fsSL https://packages.redis.io/gpg | gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
                      echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/redis.list
                      apt-get update -qq
                      apt-get install -y redis-server -qq
                      redis-server --daemonize yes --port 6379
                      redis-cli ping
              - step:
                  type: Run
                  name: Wait for Redis
                  identifier: Wait_for_Redis
                  spec:
                    shell: Sh
                    command: |-
                      for i in $(seq 1 15); do
                        redis-cli ping && break
                        echo "Waiting for Redis... attempt $i"
                        sleep 1
                      done
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm ci
              - step:
                  type: Run
                  name: Run Checks
                  identifier: Run_Checks
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run check
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      npm run test -- --coverage --coverageReporters=lcov --coverageDirectory=coverage
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  when:
                    stageStatus: Success
                    condition: <+matrix.nodeVersion> == "lts"
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage/lcov.info"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/node_modules/**,**/dist/**,**/build/**,**/*.spec.js,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/__tests__/**"
        strategy:
          matrix:
            nodeVersion:
              - "lts"
